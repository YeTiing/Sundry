spring:
  kafka:
    # 测试不连真实 Kafka，消费由测试直接调用
    listener:
      auto-startup: false
    admin:
      fail-fast: false
  datasource:
    url: ${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/sundry_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${TEST_DB_USERNAME:root}
    password: ${TEST_DB_PASSWORD:}
  data:
    redis:
      database: 15

app:
  assistant:
    # 测试保持同步审计，便于断言；异步写入另有单元测试
    audit-async: false
  feed:
    # 实验分流会改变既有 Feed 用例的用户路径，测试默认关闭
    experiment-enabled: false
  ai:
    # 默认关闭；AI 推流用例单独开启并替换 AiFeedClient
    enabled: false
  milvus:
    # 标准测试不依赖 Milvus；语义召回用例单独用 fake client
    enabled: false
  embedding:
    sync-enabled: false
  security:
    super-admin-phone: "13900000000"
  seckill:
    rate-limit-per-second: 2
    rate-limit-window-seconds: 60
  storage:
    max-image-bytes: 5242880
  jwt:
    secret: c3VuZHJ5LXRlc3Qtb25seS1qd3Qtc2VjcmV0LWtleS0yMDI2
  sms:
    provider: capturing
