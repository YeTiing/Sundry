spring:
  application:
    name: sundry
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sundry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  security:
    super-admin-phone: ${SUPER_ADMIN_PHONE:}
  order:
    pay-timeout: 30m
    cancel-batch-size: 100
    # 多实例部署时每个实例必须不同，取值 0..1023
    worker-id: ${ORDER_WORKER_ID:1}
  cleanup:
    enabled: true
    cron: "0 0 3 * * *"
    digital-grace: 7d
    image-grace: 1d
    batch-size: 100
    max-batches-per-run: 10
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    public-bucket: ${MINIO_PUBLIC_BUCKET:sundry-public}
    private-bucket: ${MINIO_PRIVATE_BUCKET:sundry-private}
    public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    max-image-bytes: 5242880
    max-digital-bytes: 2147483648
    part-size-bytes: 16777216
    upload-url-ttl: 6h
  jwt:
    secret: ${JWT_SECRET:}
    issuer: sundry
    access-ttl: 30m
    refresh-ttl: 7d
    refresh-cookie-secure: false
  sms:
    provider: log
    code-ttl: 5m
    cooldown: 60s
    attempt-ttl: 5m
    max-attempts: 5
    daily-limit: 10
