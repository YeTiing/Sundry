spring:
  application:
    name: sundry
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sundry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: sundry-seckill
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
    listener:
      ack-mode: record
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

app:
  security:
    super-admin-phone: ${SUPER_ADMIN_PHONE:}
  order:
    pay-timeout: 30m
    cancel-batch-size: 100
    # 多实例部署时每个实例必须不同，取值 0..1023
    worker-id: ${ORDER_WORKER_ID:1}
  seckill:
    topic: ${SECKILL_ORDER_TOPIC:sundry.seckill.order.create}
    result-ttl: 30m
    timeout-scan-interval: 5s
    timeout-batch-size: 100
    rate-limit-per-second: ${SECKILL_RATE_LIMIT:5}
  feed:
    behavior-batch-size: 500
    behavior-flush-interval: 2s
    behavior-retention-days: 30
    behavior-cleanup-batch-size: 5000
    behavior-cleanup-max-batches: 10
  ai:
    enabled: ${AI_FEED_ENABLED:true}
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    timeout: ${AI_TIMEOUT:5s}
    feed-candidate-limit: ${AI_FEED_CANDIDATE_LIMIT:60}
    feed-rerank-limit: ${AI_FEED_RERANK_LIMIT:20}
    feed-cache-ttl: ${AI_FEED_CACHE_TTL:10m}
    feed-pending-ttl: ${AI_FEED_PENDING_TTL:2m}
    feed-batch-size: ${AI_FEED_BATCH_SIZE:5}
    feed-build-interval: ${AI_FEED_BUILD_INTERVAL:1s}
    feed-queue-max: ${AI_FEED_QUEUE_MAX:1000}
    max-attempts: ${AI_FEED_MAX_ATTEMPTS:2}
  cleanup:
    enabled: true
    cron: "0 0 3 * * *"
    digital-grace: 7d
    image-grace: 1d
    batch-size: 100
    max-batches-per-run: 10
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    public-bucket: ${MINIO_PUBLIC_BUCKET:sundry-public}
    private-bucket: ${MINIO_PRIVATE_BUCKET:sundry-private}
    public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    max-image-bytes: 5242880
    max-digital-bytes: 2147483648
    part-size-bytes: 16777216
    upload-url-ttl: 6h
  jwt:
    secret: ${JWT_SECRET:}
    issuer: sundry
    access-ttl: 30m
    refresh-ttl: 7d
    refresh-cookie-secure: false
  sms:
    provider: log
    code-ttl: 5m
    cooldown: 60s
    attempt-ttl: 5m
    max-attempts: 5
    daily-limit: 10
