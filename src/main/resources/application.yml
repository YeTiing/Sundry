spring:
  application:
    name: sundry
  task:
    scheduling:
      pool:
        size: ${TASK_SCHEDULING_POOL_SIZE:4}
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sundry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: sundry-seckill
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
    listener:
      ack-mode: record
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus

app:
  security:
    super-admin-phone: ${SUPER_ADMIN_PHONE:}
  order:
    pay-timeout: 30m
    cancel-batch-size: 100
    # 多实例部署时每个实例必须不同，取值 0..1023
    worker-id: ${ORDER_WORKER_ID:1}
  seckill:
    topic: ${SECKILL_ORDER_TOPIC:sundry.seckill.order.create}
    result-ttl: 30m
    timeout-scan-interval: 5s
    timeout-batch-size: 100
    rate-limit-per-second: ${SECKILL_RATE_LIMIT:5}
  feed:
    behavior-batch-size: 500
    behavior-flush-interval: 2s
    behavior-retention-days: 30
    behavior-cleanup-batch-size: 5000
    behavior-cleanup-max-batches: 10
    event-topic: ${FEED_EVENT_TOPIC:sundry.feed.event}
    event-group: ${FEED_EVENT_GROUP:sundry-feed-event}
    event-exposure-retention-days: ${FEED_EXPOSURE_RETENTION_DAYS:14}
    event-click-retention-days: ${FEED_CLICK_RETENTION_DAYS:90}
    event-cleanup-batch-size: ${FEED_EVENT_CLEANUP_BATCH_SIZE:5000}
    event-cleanup-max-batches: ${FEED_EVENT_CLEANUP_MAX_BATCHES:10}
    event-cleanup-cron: ${FEED_EVENT_CLEANUP_CRON:0 30 4 * * *}
    recall-hot-limit: ${FEED_RECALL_HOT_LIMIT:120}
    recall-new-limit: ${FEED_RECALL_NEW_LIMIT:60}
    recall-category-limit: ${FEED_RECALL_CATEGORY_LIMIT:120}
    recall-co-purchase-limit: ${FEED_RECALL_CO_PURCHASE_LIMIT:80}
    recall-min-candidates: ${FEED_RECALL_MIN_CANDIDATES:60}
    recall-max-candidates: ${FEED_RECALL_MAX_CANDIDATES:500}
    recall-hot-days: ${FEED_RECALL_HOT_DAYS:30}
    recall-semantic-limit: ${FEED_RECALL_SEMANTIC_LIMIT:100}
    rate-limit-user-per-minute: ${FEED_RATE_LIMIT_USER:120}
    rate-limit-ip-per-minute: ${FEED_RATE_LIMIT_IP:60}
    featured-limit: ${FEED_FEATURED_LIMIT:3}
    featured-cache-ttl: ${FEED_FEATURED_CACHE_TTL:10s}
  milvus:
    enabled: ${MILVUS_ENABLED:true}
    base-url: ${MILVUS_URL:http://127.0.0.1:19530}
    collection: ${MILVUS_COLLECTION:sundry_product_vector}
    dim: ${EMBED_DIM:1024}
    metric: COSINE
    timeout: 10s
  embedding:
    sync-enabled: ${EMBEDDING_SYNC_ENABLED:true}
    sync-interval: ${EMBEDDING_SYNC_INTERVAL:5m}
    sync-batch-size: ${EMBEDDING_SYNC_BATCH_SIZE:200}
    sync-max-batches: ${EMBEDDING_SYNC_MAX_BATCHES:4}
    orphan-batch-size: ${EMBEDDING_ORPHAN_BATCH_SIZE:200}
  ai:
    enabled: ${AI_FEED_ENABLED:true}
    base-url: ${AI_BASE_URL:http://127.0.0.1:8000}
    internal-token: ${AI_INTERNAL_TOKEN:}
    timeout: ${AI_TIMEOUT:30s}
    feed-candidate-limit: ${AI_FEED_CANDIDATE_LIMIT:60}
    feed-rerank-limit: ${AI_FEED_RERANK_LIMIT:20}
    feed-queue-ttl: ${AI_FEED_QUEUE_TTL:30m}
    feed-variant-ttl: ${AI_FEED_VARIANT_TTL:20m}
    feed-variant-count: ${AI_FEED_VARIANT_COUNT:2}
    feed-variant-dedup-head: ${AI_FEED_VARIANT_DEDUP_HEAD:6}
    feed-variant-deadline: ${AI_FEED_VARIANT_DEADLINE:12s}
    feed-build-cooldown: ${AI_FEED_BUILD_COOLDOWN:10s}
    feed-build-rate-limit: ${AI_FEED_BUILD_RATE_LIMIT:20}
    feed-build-concurrency: ${AI_FEED_BUILD_CONCURRENCY:2}
    feed-variant-max-items: ${AI_FEED_VARIANT_MAX_ITEMS:120}
    feed-llm-max-concurrent: ${AI_FEED_LLM_MAX_CONCURRENT:4}
    feed-llm-acquire-timeout: ${AI_FEED_LLM_ACQUIRE_TIMEOUT:2s}
    feed-llm-cooldown: ${AI_FEED_LLM_COOLDOWN:30s}
    feed-batch-size: ${AI_FEED_BATCH_SIZE:5}
    feed-build-interval: ${AI_FEED_BUILD_INTERVAL:1s}
    feed-queue-max: ${AI_FEED_QUEUE_MAX:1000}
    max-attempts: ${AI_FEED_MAX_ATTEMPTS:2}
  cleanup:
    enabled: true
    cron: "0 0 3 * * *"
    digital-grace: 7d
    image-grace: 1d
    batch-size: 100
    max-batches-per-run: 10
  storage:
    endpoint: ${MINIO_ENDPOINT:http://127.0.0.1:9000}
    access-key: ${MINIO_ACCESS_KEY:}
    secret-key: ${MINIO_SECRET_KEY:}
    public-bucket: ${MINIO_PUBLIC_BUCKET:sundry-public}
    private-bucket: ${MINIO_PRIVATE_BUCKET:sundry-private}
    public-base-url: ${MINIO_PUBLIC_URL:http://localhost:9000}
    max-image-bytes: 5242880
    max-digital-bytes: 2147483648
    part-size-bytes: 16777216
    upload-url-ttl: 6h
  jwt:
    secret: ${JWT_SECRET:}
    issuer: sundry
    access-ttl: 30m
    refresh-ttl: 7d
    refresh-cookie-secure: false
  sms:
    provider: log
    code-ttl: 5m
    cooldown: 60s
    attempt-ttl: 5m
    max-attempts: 5
    daily-limit: 10
