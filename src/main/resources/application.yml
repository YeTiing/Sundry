spring:
  application:
    name: sundry
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/sundry?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      timeout: 3s
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health

app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: sundry
    access-ttl: 30m
    refresh-ttl: 7d
    refresh-cookie-secure: false
  sms:
    provider: log
    code-ttl: 5m
    cooldown: 60s
    attempt-ttl: 5m
    max-attempts: 5
    daily-limit: 10
