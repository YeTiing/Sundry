version: 1

base:
  from_table: orders
  from_alias: o
  time_column: o.paid_at
  joins:
    - table: order_item
      alias: oi
      "on": oi.order_id = o.id
    - table: product
      alias: p
      "on": p.id = oi.product_id
    - table: category
      alias: c
      "on": c.id = p.category_id
    - table: app_user
      alias: u
      "on": u.id = o.user_id
  where:
    - "o.paid_at IS NOT NULL"

metrics:
  gmv:
    label: 销售额
    synonyms: [GMV, 营收, 成交额, 卖了多少钱]
    unit: 元
    expr: "SUM(oi.price * oi.quantity)"

  paid_order_count:
    label: 支付订单数
    synonyms: [订单量, 成单数, 多少单]
    unit: 单
    expr: "COUNT(DISTINCT o.order_no)"

  avg_order_value:
    label: 客单价
    synonyms: [平均每单金额]
    unit: 元
    expr: "SUM(oi.price * oi.quantity) / NULLIF(COUNT(DISTINCT o.order_no), 0)"

  product_sold_count:
    label: 商品销量
    synonyms: [卖出多少件]
    unit: 件
    expr: "SUM(oi.quantity)"

  refund_amount:
    label: 退款金额
    synonyms: [退了多少钱]
    unit: 元
    expr: "SUM(r.refund_amount)"
    conditional_join: refund_summary

  refund_rate:
    label: 退款率
    synonyms: [退货率, 退款占比]
    unit: "%"
    expr: "COUNT(DISTINCT CASE WHEN r.order_id IS NOT NULL THEN o.id END) * 1.0 / NULLIF(COUNT(DISTINCT o.id), 0)"
    conditional_join: refund_summary

  seckill_order_count:
    label: 秒杀订单数
    synonyms: [秒杀单量]
    unit: 单
    expr: "COUNT(DISTINCT CASE WHEN o.order_source = 'SECKILL' THEN o.order_no END)"

  refund_order_count:
    label: 退款订单数
    synonyms: [退款单数]
    unit: 单
    expr: "COUNT(DISTINCT CASE WHEN r.order_id IS NOT NULL THEN o.id END)"
    conditional_join: refund_summary

  avg_item_price:
    label: 平均商品单价
    synonyms: [均价, 平均单价]
    unit: 元
    expr: "AVG(oi.price)"

  seckill_gmv:
    label: 秒杀销售额
    synonyms: [秒杀GMV]
    unit: 元
    expr: "SUM(CASE WHEN o.order_source = 'SECKILL' THEN oi.price * oi.quantity ELSE 0 END)"

dimensions:
  day:
    label: 日期
    column: "DATE(o.paid_at)"
    granularity: [day, week, month]
  category:
    label: 商品分类
    synonyms: [类目, 品类]
    column: c.name
  product:
    label: 商品
    column: oi.product_name
  order_source:
    label: 订单来源
    column: o.order_source
  product_type:
    label: 商品类型
    column: oi.product_type
  status:
    label: 订单状态
    synonyms: [状态]
    column: o.status
  buyer:
    label: 买家
    synonyms: [用户, 客户]
    # 展示层直接脱敏，按用户 id 分组避免同名合并
    column: "CONCAT(COALESCE(NULLIF(u.nickname, ''), '用户'), '#', u.id, '（', LEFT(u.phone, 3), '****', RIGHT(u.phone, 4), '）')"

filters:
  status:
    label: 订单状态
    column: o.status
    type: enum
    values: [PAID, PACKING, SHIPPED, COMPLETED, REFUND_REQUESTED, RETURN_REQUESTED,
             RETURNING, RETURN_SHIPPED, REFUNDED]
  order_source:
    label: 订单来源
    column: o.order_source
    type: enum
    values: [NORMAL, SECKILL]
  product_type:
    label: 商品类型
    column: oi.product_type
    type: enum
    values: [PHYSICAL, DIGITAL]
  category_id:
    label: 商品分类
    column: c.id
    type: id
  paid_at:
    label: 支付时间
    column: o.paid_at
    type: time

conditional_joins:
  refund_summary: >
    LEFT JOIN (
      SELECT order_id, SUM(amount) AS refund_amount
      FROM order_refund
      WHERE status = 'COMPLETED'
      GROUP BY order_id
    ) r ON r.order_id = o.id

time_presets: [TODAY, YESTERDAY, LAST_7D, LAST_30D, THIS_MONTH, LAST_MONTH, LAST_QUARTER]

limits:
  max_metrics: 3
  max_dimensions: 3
  max_range_days: 365
  max_rows: 1000
